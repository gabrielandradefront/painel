<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGOS OPS</title>
  <meta name="description" content="ARGOS OPS — Painel operacional e administrativo para gestão de aulas, orçamento e operações.">
  <meta property="og:title" content="ARGOS OPS">
  <meta property="og:description" content="ARGOS OPS — Painel operacional e administrativo para gestão de aulas, orçamento e operações.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#121316">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="top">
      <div class="brand-badge-tech" id="appBrandTitle" title="ARGOS OPS" role="heading" aria-level="1">
        <span class="brand-argos">ΛRGOS</span>
        <div class="brand-ops-badge">
          OPS
          <span class="brand-live-indicator">LIVE</span>
        </div>
      </div>
      <div class="top-search-group">
        <select id="filtroTipoGlobal" class="top-filter-select" title="Filtrar por tipo" aria-label="Filtrar painel por tipo">
          <option value="todos">Todos os tipos</option>
          <option value="aulas">Aulas</option>
          <option value="operacional">Operacional</option>
          <option value="orc">Orçamento</option>
        </select>
        <div class="top-search-input-wrap">
          <span class="top-search-icon">🔍</span>
          <input id="buscaGlobal" placeholder="Buscar no painel..." autocomplete="off">
          <button id="btnLimparBuscaTop" class="top-search-clear" title="Limpar busca" style="display:none;" data-act="limparBuscaGlobal">✕</button>
        </div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="v"></div>
  </main>
  <div id="toast"></div>

  <!-- Bibliotecas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Scripts Modulares do Painel Prius -->
  <script src="core.js"></script>
  <script src="orcamento.js"></script>
  <script src="operacional.js"></script>
  <script src="aulas.js"></script>
  <script src="hoje.js"></script>
  <script src="app.js"></script>
  <script src="snake.js"></script>
  <script type="module" src="/src/recharts-bridge.js"></script>
</body>
</html>
