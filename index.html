<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGOS OPS</title>
  <meta name="description" content="ARGOS OPS — Painel operacional e administrativo para gestão de aulas, orçamento e operações.">
  <meta property="og:title" content="ARGOS OPS">
  <meta property="og:description" content="ARGOS OPS — Painel operacional e administrativo para gestão de aulas, orçamento e operações.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%230f172a' stroke='%23d97706' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fbbf24' stroke-width='3.5'/%3E%3Cline x1='32' y1='9' x2='32' y2='15' stroke='%23fbbf24' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='32' y1='49' x2='32' y2='55' stroke='%23fbbf24' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='9' y1='32' x2='15' y2='32' stroke='%23fbbf24' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='49' y1='32' x2='55' y2='32' stroke='%23fbbf24' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M32 18 L39 29 L26 26 Z M46 32 L35 39 L38 26 Z M32 46 L25 35 L38 38 Z M18 32 L29 25 L26 38 Z' fill='%23fbbf24' opacity='0.85'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%230f172a'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23fbbf24'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#121316">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="top">
      <div class="brand-badge-tech" id="appBrandTitle" title="ARGOS OPS" role="heading" aria-level="1">
        <span class="brand-argos">ΛRGOS</span>
        <div class="brand-ops-badge">
          OPS
          <span class="brand-live-indicator">LIVE</span>
        </div>
      </div>
      <div class="top-search-group">
        <div class="global-search-wrapper top-search-input-wrap" id="globalSearchWrapper">
          <span class="top-search-icon ui-glyph" aria-hidden="true">⌕</span>
          <input id="buscaGlobal" placeholder="Buscar no painel ou filtrar aba atual..." autocomplete="off">
          <button id="btnLimparBuscaTop" class="top-search-clear" title="Limpar busca" style="display:none;" data-act="limparBuscaGlobal" type="button" aria-label="Limpar busca">✕</button>
          <button id="btnToggleSearchFilter" class="search-filter-trigger" type="button" data-act="toggle_search_filter" title="Filtrar resultados" aria-label="Filtrar resultados" aria-haspopup="true" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            <span class="search-filter-dot" id="searchFilterDot" aria-hidden="true"></span>
          </button>
          <div id="searchFilterPopover" class="search-filter-popover" role="dialog" aria-label="Filtros de busca" style="display:none;"></div>
        </div>
        <div class="sheets-popover-anchor" id="sheetsPopoverAnchor">
          <button id="btnOpenSheetsMenu" class="b top-sheets-btn" type="button" data-act="toggle_sheets_menu" title="Planilhas de Apoio" aria-label="Planilhas de Apoio" aria-haspopup="true" aria-expanded="false"><span class="ui-glyph" aria-hidden="true">▤</span> Planilhas</button>
          <div id="sheetsQuickPopover" class="sheets-popover" role="dialog" aria-label="Planilhas de Apoio" style="display:none;"></div>
        </div>
        <button id="btnOpenSettings" class="b top-settings-btn" data-act="abrir_config_modal" title="Configurações e Sistema" aria-label="Configurações e Sistema"><span class="ui-glyph" aria-hidden="true">&#9881;&#xFE0E;</span></button>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="v"></div>
  </main>
  <div id="toast"></div>

  <!-- Modal Unificado de Configurações e Sistema -->
  <div id="modalSystemSettings" class="modal-presets-overlay modal-settings-overlay" style="display: none;">
    <div class="modal-presets-card modal-settings-card" role="dialog" aria-modal="true" aria-labelledby="modalSettingsTitle">
      <div class="modal-presets-header modal-settings-header">
        <div style="display:flex; align-items:center; gap:9px;">
          <span class="ui-glyph" style="font-size:18px;" aria-hidden="true">&#9881;&#xFE0E;</span>
          <b id="modalSettingsTitle" style="font-size:16px; color:var(--tx);">Configurações e Sistema</b>
        </div>
        <button class="x" data-act="fechar_config_modal" title="Fechar (Esc)" aria-label="Fechar configurações" style="font-size:18px;">✕</button>
      </div>

      <div class="modal-settings-tabs" role="tablist" aria-label="Abas de configurações">
        <button type="button" class="modal-settings-tab active" data-act="settings_tab" data-tab="geral" role="tab" aria-selected="true"><span class="ui-glyph" aria-hidden="true">&#9881;&#xFE0E;</span> Geral</button>
        <button type="button" class="modal-settings-tab" data-act="settings_tab" data-tab="presets" role="tab" aria-selected="false">Predefinições</button>
        <button type="button" class="modal-settings-tab" data-act="settings_tab" data-tab="professores" role="tab" aria-selected="false">Gestão de Professores</button>
      </div>

      <div class="modal-settings-body">
        <!-- Aba 1: Geral -->
        <div id="settingsTabPanelGeral" class="modal-settings-panel active" data-settings-panel="geral"></div>

        <!-- Aba 2: Predefinições -->
        <div id="settingsTabPanelPresets" class="modal-settings-panel" data-settings-panel="presets" style="display:none;">
          <div class="modal-presets-tabs modal-presets-subtabs" role="tablist" aria-label="Categorias de predefinições">
            <button type="button" class="modal-presets-tab active" data-act="preset_tab" data-tab="reparos">Reparos</button>
            <button type="button" class="modal-presets-tab" data-act="preset_tab" data-tab="operacao">Operação / Controle</button>
            <button type="button" class="modal-presets-tab" data-act="preset_tab" data-tab="orcamentos">Orçamentos</button>
            <button type="button" class="modal-presets-tab" data-act="preset_tab" data-tab="notas">Notas</button>
          </div>
          <div class="modal-presets-body" style="padding: 16px 0 0;">
            <div class="mu" style="margin-bottom:12px; font-size:12.5px;">Adicione ou remova opções padrão utilizadas em todo o sistema.</div>
            <form id="formAddPreset" class="modal-presets-form">
              <select id="presetSelectSub" aria-label="Subcategoria da predefinição" style="flex:1 1 170px;"></select>
              <input id="presetInputNome" placeholder="Nome da nova opção..." required autocomplete="off" style="flex:2 1 180px;">
              <input id="presetInputExtra" placeholder="URL ou link padrão opcional (fornecedores)" autocomplete="off" style="flex:2 1 180px; display:none;">
              <button type="submit" class="b p" style="white-space:nowrap;">Adicionar</button>
            </form>
            <div class="modal-presets-chips-wrap" id="modalPresetsChipsContainer">
              <!-- Chips gerados dinamicamente -->
            </div>
          </div>
        </div>

        <!-- Aba 3: Gestão de Professores -->
        <div id="settingsTabPanelProfessores" class="modal-settings-panel" data-settings-panel="professores" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- Bibliotecas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Scripts Modulares do ARGOS OPS -->
  <script src="core.js"></script>
  <script src="presets.js"></script>
  <script src="orcamento.js"></script>
  <script src="operacional.js"></script>
  <script src="aulas.js"></script>
  <script src="hoje.js"></script>
  <script src="app.js"></script>
  <script src="snake.js"></script>
  <script type="module" src="/src/recharts-bridge.js"></script>
</body>
</html>
